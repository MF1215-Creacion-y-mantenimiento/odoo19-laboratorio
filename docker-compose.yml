services:
  db:
    image: postgres:16
    container_name: odoo19_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U odoo -d postgres
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - odoo_network

  odoo:
    image: odoo:19
    container_name: odoo19_app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
    
    ports:
      - "127.0.0.1:8069:8069"

    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons

    networks:
      - odoo_network

volumes:
    postgres_data:
    odoo_data:

networks:
  odoo_network:
    driver: bridge