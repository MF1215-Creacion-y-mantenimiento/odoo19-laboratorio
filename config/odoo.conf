[options]

; Conexión con PostgreSQL
db_host = db
db_name = odoo
db_port = 5432
db_user = odoo
db_password = 1234

; Directorios de modulos
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Datos persistentes
data_dir = /var/lib/odoo

; Clave maestra para gestionar las bases
admin_passwd = 123456

; Desarrollo
list_db = True
proxy_mode = False
log_level = info